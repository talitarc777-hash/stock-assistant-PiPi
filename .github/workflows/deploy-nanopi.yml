name: Deploy Backend To NanoPi

# Disabled for now because the NanoPi is already pulling changes on a timer.
# Re-enable the push trigger below if you decide to use GitHub Actions SSH deploy.
on:
  workflow_dispatch:

# on:
#   push:
#     branches:
#       - main
#     paths:
#       - "app/**"
#       - "bot/**"
#       - "config/**"
#       - "scripts/**"
#       - "requirements.txt"
#       - ".github/workflows/deploy-nanopi.yml"
#       - "deploy/pi/**"
#   workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          NANOPI_HOST: ${{ secrets.NANOPI_HOST }}
          NANOPI_PORT: ${{ secrets.NANOPI_PORT }}
          NANOPI_USER: ${{ secrets.NANOPI_USER }}
          NANOPI_SSH_KEY: ${{ secrets.NANOPI_SSH_KEY }}
          NANOPI_APP_DIR: ${{ secrets.NANOPI_APP_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in NANOPI_HOST NANOPI_PORT NANOPI_USER NANOPI_SSH_KEY NANOPI_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub repo Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s\n' "$NANOPI_SSH_KEY" | grep -Eq '^-+BEGIN (OPENSSH|RSA|EC) PRIVATE KEY-+$'; then
            echo "::error::NANOPI_SSH_KEY does not look like a private key. Paste the full private key, including BEGIN/END lines, not the .pub public key."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NANOPI_HOST }}
          username: ${{ secrets.NANOPI_USER }}
          key: ${{ secrets.NANOPI_SSH_KEY }}
          port: ${{ secrets.NANOPI_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.NANOPI_APP_DIR }}"
            BRANCH="main"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repo"
              exit 1
            fi

            cd "$APP_DIR"

            # Migrate mutable account state out of the Git checkout before an
            # update can replace tracked files. The app uses this location in
            # production even when PROFILE_DB_PATH is still a relative path.
            PERSISTENT_DIR="$HOME/.local/share/stock-assistant"
            mkdir -p "$PERSISTENT_DIR"
            if [ ! -f "$PERSISTENT_DIR/user_profiles.db" ] && [ -f "$APP_DIR/data/user_profiles.db" ]; then
              LEGACY_DB="$APP_DIR/data/user_profiles.db" \
              PERSISTENT_DB="$PERSISTENT_DIR/user_profiles.db" \
              .venv/bin/python - <<'PY'
            import os
            import sqlite3

            source = sqlite3.connect(os.environ["LEGACY_DB"])
            target = sqlite3.connect(os.environ["PERSISTENT_DB"])
            try:
                source.backup(target)
            finally:
                target.close()
                source.close()
            PY
            fi

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            .venv/bin/python -m pip install -r requirements.txt

            sudo -n systemctl restart stock-assistant-api
            sudo -n systemctl restart stock-assistant-discord

            systemctl is-active --quiet stock-assistant-api
            systemctl is-active --quiet stock-assistant-discord

            curl -fsS http://127.0.0.1:8000/health > /dev/null
            echo "Deploy finished successfully."
